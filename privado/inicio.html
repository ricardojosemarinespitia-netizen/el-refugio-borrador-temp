<script>
(async function () {
  var H = window.Refugio, CAL = H.CAL, C = window.REFUGIO_CONTENIDO, esc = H.escapar;
  var raiz = document.getElementById("contenido");

  var p = await H.guardia(raiz);
  if (!p) return;

  var cal = p.calendario, ahora = H.ahora();
  var paso = cal.pasoActual(ahora);          // -1 antes de empezar · 0 Noche 1 · 1..21
  var terminado = cal.terminado(ahora);
  var semanaHoy = paso < 0 ? 1 : CAL.semanaDe(paso);
  var html = "";

  html += '<h1 class="saludo">Hola' + (p.primerNombre ? ", " + esc(p.primerNombre) : "") + ".</h1>";

  // ================= HOY =================
  html += '<section class="caja-bosque" aria-labelledby="hoy-titulo"><img class="mariposa-fondo" src="/el-refugio-borrador-temp/img/mariposa-crema.webp" alt="" width="241" height="197" aria-hidden="true">';
  if (paso < 0) {
    var faltan = cal.diasParaComenzar(ahora);
    html += '<span class="rotulo">Tu primera noche</span>' +
      '<p class="hoy-paso" id="hoy-titulo">' + esc(CAL.fechaLarga(cal.apertura(0))) + "</p>" +
      '<p class="hoy-semana">Noche 1 · Semana 1 · ' + esc(C.semanas[0].nombre) + "</p>" +
      '<p class="cuenta-atras">' + faltan + '</p><p class="suave">' + (faltan === 1 ? "día para comenzar" : "días para comenzar") + "</p>" +
      '<p class="suave">Mientras tanto, empieza por el saludo de Nanalú y tus materiales clave. ' + H.PENDIENTE + "</p>" +
      (cal.puedeCambiarFecha(ahora) ? '<a class="boton contorno-claro" href="/el-refugio-borrador-temp/privado/comenzar.html?cambiar=1">Cambiar mi fecha de inicio</a>' : "");
  } else if (terminado && !p.ver_todo) {
    html += '<span class="rotulo">Tu recorrido</span>' +
      '<p class="hoy-paso" id="hoy-titulo">Tres semanas</p>' +
      '<p class="hoy-semana">Puedes volver a recorrerlo todas las veces que lo desees. Siempre irás más profundo, y traerá más paz y comprensión.</p>' +
      '<a class="boton claro grande" href="/el-refugio-borrador-temp/privado/dia.html?n=1">Volver al Día 1</a>';
  } else if (paso === 0) {
    html += '<span class="rotulo">Hoy</span>' +
      '<p class="hoy-paso" id="hoy-titulo">Noche 1</p>' +
      '<p class="hoy-semana">Semana 1 · ' + esc(C.semanas[0].nombre) + "</p>" +
      '<a class="boton claro grande" href="/el-refugio-borrador-temp/privado/dia.html?n=0">Ir a mi Noche 1</a>';
  } else {
    var s = C.semanas[semanaHoy - 1];
    html += '<span class="rotulo">Hoy</span>' +
      '<p class="hoy-paso" id="hoy-titulo">Día ' + paso + '</p>' +
      '<p class="hoy-semana">' + (paso === CAL.TOTAL_DIAS ? "y Noche de Unidad" : "y Noche " + (paso + 1)) + " · Semana " + semanaHoy + " · " + esc(s.nombre) + "</p>" +
      '<a class="boton claro grande" href="/el-refugio-borrador-temp/privado/dia.html?n=' + paso + '">Ir a mi día de hoy</a>';
  }
  html += "</section>";

  // ================= EL RECORRIDO =================
  html += '<div class="seccion-titulo"><span class="rotulo">Tu recorrido</span><h2>' + esc(C.recorrido.semanas) + "</h2></div>";

  function circulo(n) {
    var abierto = cal.abierto(n, ahora);
    var etiqueta = n === 0 ? "N1" : String(n);
    var nombre = n === 0 ? "Noche 1" : "Día " + n;
    if (abierto) {
      var esHoy = n === paso && !terminado;
      return '<a class="circulo' + (esHoy ? " hoy" : "") + '" href="/el-refugio-borrador-temp/privado/dia.html?n=' + n + '" aria-label="' + nombre + (esHoy ? ", hoy" : ", abierto") + '">' + etiqueta + "</a>";
    }
    return '<span class="circulo" aria-label="' + nombre + ", se abre " + esc(cal.textoApertura(n, ahora)) + '">' + etiqueta + "</span>";
  }

  C.semanas.forEach(function (s) {
    var actual = s.numero === semanaHoy && !terminado;
    html += '<section class="semana' + (actual ? " actual" : "") + '" aria-labelledby="sem-' + s.numero + '">' +
      '<div class="semana-cabeza"><div><span class="rotulo">Semana ' + s.numero + '</span><h3 id="sem-' + s.numero + '">' + esc(s.nombre) + "</h3></div>" +
      (actual ? '<span class="marca-aqui">' + (paso < 0 ? "Empiezas aquí" : "Estás aquí") + "</span>" : "") + "</div>" +
      '<p class="semana-lema">' + esc(s.lema) + "</p>";
    if (s.numero === 1) {
      var a0 = cal.abierto(0, ahora);
      // La Noche 1 va sola, antes del Día 1: todo el renglón es el enlace
      html += '<div class="semana-noche1">' + (a0
        ? '<a class="noche1 abierta" href="/el-refugio-borrador-temp/privado/dia.html?n=0"><span class="circulo' + (paso === 0 && !terminado ? " hoy" : "") + '" aria-hidden="true">N1</span><span class="noche1-texto">Noche 1 · antes del Día 1</span></a>'
        : '<span class="noche1">' + circulo(0) + '<span class="noche1-texto">Noche 1 · ' + esc(CAL.fechaCorta(cal.apertura(0))) + "</span></span>") + "</div>";
    }
    html += '<ol class="circulos">';
    for (var n = (s.numero - 1) * 7 + 1; n <= s.numero * 7; n++) {
      html += "<li>" + circulo(n) + '<span class="fecha">' + esc(CAL.fechaCorta(cal.apertura(n))) + "</span></li>";
    }
    html += "</ol></section>";
  });
  html += '<p class="leyenda" aria-hidden="true"><span class="l-hoy">Hoy</span><span class="l-abierto">Abierto</span><span class="l-cerrado">Se abre en su fecha</span></p>';

  // ================= PARA TU VIAJE =================
  html += '<div class="seccion-titulo"><span class="rotulo">Para tu viaje</span><h2>Antes de comenzar</h2></div>';

  function plegable(id, titulo, resumen, cuerpo, abierto) {
    return '<details class="plegable" id="' + id + '"' + (abierto ? " open" : "") + '><summary><span class="plegable-txt"><strong>' + titulo + "</strong><span>" + resumen + '</span></span><span class="plegable-flecha" aria-hidden="true"></span></summary><div class="plegable-cuerpo">' + cuerpo + "</div></details>";
  }

  var B = C.bienvenida;
  var carta = '<div class="carta"><p class="carta-encabezado">' + esc(B.encabezado) + "</p>" +
    B.parrafos.map(function (t) { return "<p>" + esc(t).replace("contacto@matrizdevida.com", '<a href="mailto:contacto@matrizdevida.com">contacto@matrizdevida.com</a>') + "</p>"; }).join("") +
    '<p class="firma">' + B.firma.map(esc).join("<br>") + "</p></div>";
  html += plegable("bienvenida", esc(B.titulo), "Bienvenida", carta, paso <= 0);

  var enc = C.encuentro.map(function (e) {
    return '<div class="paso-escaneo"><h3>' + esc(e.titulo) + ' <span class="duracion">' + esc(e.duracion) + "</span></h3>" + H.video(e.video, e.titulo) + "</div>";
  }).join("");
  html += plegable("encuentro", "Encuentro terapéutico", "Encuentro inicial · Los pilares que nos sostienen · Plan de acción", enc, false);

  html += '<a class="plegable plegable-enlace" href="/el-refugio-borrador-temp/privado/materiales.html"><span class="plegable-txt" style="padding:16px 24px"><strong>Materiales clave</strong><span>Guía general · Acciones diarias · Checklist imprimible · Saludo al sol</span></span></a>';
  html += '<a class="plegable plegable-enlace" href="/el-refugio-borrador-temp/privado/bonos.html"><span class="plegable-txt" style="padding:16px 24px"><strong>Bonos</strong><span>Tres regalos para acompañarte</span> ' + H.PENDIENTE + "</span></a>";

  raiz.innerHTML = html;
  raiz.insertAdjacentHTML("afterend", H.pieHTML());
  H.activarSalir();

  var ancla = (location.hash || "").slice(1);
  var det = ancla && document.getElementById(ancla);
  if (det && det.tagName === "DETAILS") { det.open = true; det.scrollIntoView({ block: "start" }); }
})();
</script>
</body>
</html>
